<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>局中局：东亚女孩守则</title>
  </head>
  <body>
    <main id="app">
      <section class="hud" aria-live="polite">
        <div class="eyebrow">AHOLO LUX3D / INTERACTIVE STORY</div>
        <h1>今天也要回答得体</h1>
        <p id="subtitle">一场普通的家庭饭局，和一些“不太方便”的答案。</p>
        <div class="progress" aria-label="规则进度">
          <span class="progress-dot is-active" data-rule-dot="0"></span>
          <span class="progress-line"></span>
          <span class="progress-dot" data-rule-dot="1"></span>
          <span class="progress-line"></span>
          <span class="progress-dot" data-rule-dot="2"></span>
        </div>
      </section>

      <section class="rule-card" id="rule-card">
        <div class="rule-label">饭局话题 <span id="rule-number">1</span> / 3</div>
        <h2 id="rule-title">长辈把一块菜夹进你的碗里。</h2>
        <p id="rule-copy">你已经吃饱了，但所有人的目光都落在这双筷子上。试着输入你想说的话。</p>
        <form class="choice-row" id="choice-form">
          <label class="sr-only" for="answer-input">输入你的回答</label>
          <input id="answer-input" autocomplete="off" placeholder="例如：谢谢，我吃饱了" />
          <button class="choice-button" type="submit">回答</button>
        </form>
        <div class="suggestions" id="suggestions">
          <button type="button" class="suggestion" data-suggestion="谢谢，我吃饱了">谢谢，我吃饱了</button>
          <button type="button" class="suggestion" data-suggestion="不要了，谢谢">不要了，谢谢</button>
        </div>
      </section>

      <section class="message" id="message" role="status">
        <strong id="message-label">观察</strong>
        <span id="message-text">你可以输入任何回答。这里没有“正确答案”，只有不同的后果。</span>
      </section>

      <section class="chat-log" id="chat-log" aria-live="polite"></section>
      <button class="reset-button" id="reset-button" type="button">重新开始</button>
      <div class="crosshair" aria-hidden="true"></div>
      <div id="scene" aria-label="可交互的三维饭厅场景"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
